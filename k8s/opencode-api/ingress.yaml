apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ai.dylanvh.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: opencode-api
                port:
                  number: 8788
