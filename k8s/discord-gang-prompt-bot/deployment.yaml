apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-gang-prompt-bot
  labels:
    app: discord-gang-prompt-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-gang-prompt-bot
  template:
    metadata:
      labels:
        app: discord-gang-prompt-bot
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: pi
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: discord-gang-prompt-bot
          image: ghcr.io/dylanvanh/discord-gang-prompt-bot:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: discord-gang-prompt-bot-config
            - secretRef:
                name: discord-gang-prompt-bot-secrets
