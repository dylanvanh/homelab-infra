apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: dietdial.dylanvh.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dietdial-web
                port:
                  number: 80
    - host: linkding.dylanvh.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 9090
    - host: nuke.dylanvh.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nuke-app
                port:
                  number: 3000
    - host: pixelpythons.dylanvh.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pixel-pythons
                port:
                  number: 3001
