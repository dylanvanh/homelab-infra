apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-dietdial
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-dietdial
  template:
    metadata:
      labels:
        app: cloudflared-dietdial
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: cloudflared-dietdial
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.9.1
        args:
        - tunnel
        - --no-autoupdate
        - --protocol
        - http2
        - --metrics
        - 0.0.0.0:2000
        - run
        envFrom:
        - secretRef:
            name: dietdial-postgres-tunnel
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
