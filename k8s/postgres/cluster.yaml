apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610120828-standard-trixie@sha256:c7747d8d1049fff9cf30d9cd83d14d609c957afb5ffbcd114145f393ea1850e1
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      lc_messages: en_US.utf8
      lc_monetary: en_US.utf8
      lc_numeric: en_US.utf8
      lc_time: en_US.utf8
  storage:
    size: 10Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: investec
      owner: app
      secret:
        name: postgres-app-secret
  monitoring:
    enablePodMonitor: true
  certificates:
    serverCASecret: postgres-server-ca
    serverAltDNSNames:
    - dietdial-db.dylanvh.com
    - localhost
