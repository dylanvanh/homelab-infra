apiVersion: v1
kind: Service
metadata:
  name: ascend-api
  labels:
    app: ascend-api
spec:
  type: ClusterIP
  ports:
    - port: 8787
      targetPort: 8787
      name: http
  selector:
    app: ascend-api
---
apiVersion: v1
kind: Service
metadata:
  name: ascend-web
  labels:
    app: ascend-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: ascend-web
