apiVersion: apps/v1
kind: Deployment
metadata:
  name: dietdial-web
  labels:
    app: dietdial-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dietdial-web
  template:
    metadata:
      labels:
        app: dietdial-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: my-vps
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: dietdial-web
          image: ghcr.io/dylanvanh/dietdial-web:web-sol-20261106-233a60c@sha256:46514817cc076547e8bd162975949ca208b74ff7b40baa52cb191b0df318f08b
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: nginx-config
          configMap:
            name: dietdial-web
