apiVersion: apps/v1
kind: Deployment
metadata:
  name: dietdial-web
  labels:
    app: dietdial-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dietdial-web
  template:
    metadata:
      labels:
        app: dietdial-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: my-vps
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: dietdial-web
          image: ghcr.io/dylanvanh/dietdial-web:latest@sha256:f719edec82be38b10e4e3cf55b418ded07eb7ad6552d18b6427589fced4fb747
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: nginx-config
          configMap:
            name: dietdial-web
