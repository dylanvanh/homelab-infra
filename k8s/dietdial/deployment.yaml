apiVersion: apps/v1
kind: Deployment
metadata:
  name: dietdial-web
  labels:
    app: dietdial-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dietdial-web
  template:
    metadata:
      labels:
        app: dietdial-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: my-vps
      containers:
        - name: dietdial-web
          image: dietdial-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: nginx-config
          configMap:
            name: dietdial-web
