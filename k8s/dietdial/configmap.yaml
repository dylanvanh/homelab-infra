apiVersion: v1
kind: ConfigMap
metadata:
  name: dietdial-web
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass https://menufit.dylanvh.com.;
            proxy_ssl_server_name on;
            proxy_ssl_name menufit.dylanvh.com;
            proxy_set_header Host menufit.dylanvh.com;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /_expo/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }
    }
